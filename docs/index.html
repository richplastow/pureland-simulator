<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pureland Simulator</title>
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mNoIBEwjGoY1TB8NQAAJYSAELxv8c8AAAAASUVORK5CYII="
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas
      class="scene"
      tabindex="0"
      role="img"
      aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Shift+ArrowUp Shift+ArrowDown Enter"
      aria-label="A sheet of origami paper, which folds into designs or along a printed grid, and turns when dragged"
    ></canvas>
    <div class="controls">
      <div class="choices" role="radiogroup" aria-label="Mode">
        <label>
          <input type="radio" name="mode" value="presentation" />
          Presentation
        </label>
        <label>
          <input type="radio" name="mode" value="gameplay" checked />
          Gameplay
        </label>
        <label>
          <input type="radio" name="mode" value="sandbox" />
          Sandbox
        </label>
      </div>
      <div
        class="choices gameplay-designs"
        role="radiogroup"
        aria-label="Design"
      >
        <label>
          <input
            type="radio"
            name="gameplay-design"
            value="2f0a6b7e-3c1d-4e8f-9a2b-6c5d4e3f2a1b"
            checked
          />
          Blintz
        </label>
        <label>
          <input type="radio" name="gameplay-design" value="yacht" />
          Yacht
        </label>
        <label>
          <input type="radio" name="gameplay-design" value="mount-fuji" />
          Mount Fuji
        </label>
        <label>
          <input type="radio" name="gameplay-design" value="paper-dart" />
          Paper Dart
        </label>
      </div>
      <div
        class="choices patterns"
        role="radiogroup"
        aria-label="Pattern"
        hidden
      >
        <label>
          <input
            type="radio"
            name="pattern"
            value="square-half-diagonals"
            checked
          />
          Square ½
        </label>
        <label>
          <input type="radio" name="pattern" value="square-quarter" />
          Square ¼
        </label>
        <label>
          <input type="radio" name="pattern" value="oblong-half-diagonals" />
          Oblong ½
        </label>
        <label>
          <input type="radio" name="pattern" value="oblong-quarter" />
          Oblong ¼
        </label>
      </div>
      <div class="sandbox-bar" role="group" aria-label="Folds" hidden>
        <button type="button" data-undo disabled>Undo</button>
        <button type="button" data-redo disabled>Redo</button>
        <button type="button" data-unfold disabled>Unfold</button>
        <button type="button" data-export disabled>Export</button>
      </div>
      <div
        class="choices designs"
        role="radiogroup"
        aria-label="Design"
        hidden
      >
        <label>
          <input type="radio" name="design" value="pencil" checked />
          Pencil
        </label>
        <label>
          <input type="radio" name="design" value="mount-fuji" />
          Mount Fuji
        </label>
        <label>
          <input type="radio" name="design" value="flat" />
          Flat
        </label>
        <label>
          <input type="radio" name="design" value="yacht" />
          Yacht
        </label>
        <label>
          <input type="radio" name="design" value="paper-dart" />
          Paper Dart
        </label>
        <label>
          <input type="radio" name="design" value="heart" />
          Heart
        </label>
        <label>
          <input
            type="radio"
            name="design"
            value="2f0a6b7e-3c1d-4e8f-9a2b-6c5d4e3f2a1b"
          />
          Blintz
        </label>
      </div>
      <label>
        <input type="checkbox" checked data-fold-lines />
        Fold lines
      </label>
      <label hidden>
        <input type="checkbox" checked data-fast-fold />
        Fast Fold
      </label>
      <div class="paper-colors" role="radiogroup" aria-label="Paper colour">
        <input
          type="radio"
          name="paper-color"
          value="red"
          aria-label="Red"
          checked
        />
        <input
          type="radio"
          name="paper-color"
          value="green"
          aria-label="Green"
        />
        <input
          type="radio"
          name="paper-color"
          value="blue"
          aria-label="Blue"
        />
        <input
          type="radio"
          name="paper-color"
          value="orange"
          aria-label="Orange"
        />
        <input
          type="radio"
          name="paper-color"
          value="pink"
          aria-label="Pink"
        />
      </div>
    </div>
    <dialog class="export-dialog" aria-label="Export">
      <label>
        Copy this JSON, and save it as a design file in docs/src/designs/
        to add it as a design.
        <textarea readonly spellcheck="false"></textarea>
      </label>
      <form method="dialog">
        <button type="button" data-copy>Copy</button>
        <button type="submit">Close</button>
      </form>
    </dialog>
  </body>
</html>
